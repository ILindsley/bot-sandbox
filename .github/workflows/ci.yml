name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm test
  marker-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require MARKER.txt to contain the token
        run: |
          set -u
          want="${{ vars.MARKER_TOKEN }}"
          if [ -z "$want" ]; then
            echo "marker-guard FAILED: repository variable MARKER_TOKEN is not set"
            exit 1
          fi
          if [ ! -f MARKER.txt ]; then
            echo "marker-guard FAILED: MARKER.txt not found at the repo root"
            exit 1
          fi
          actual="$(cat MARKER.txt)"
          if [ "$actual" != "$want" ]; then
            echo "marker-guard FAILED: MARKER.txt must contain exactly this token: $want"
            exit 1
          fi
          echo "marker-guard OK"
